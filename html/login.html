<!-- registration page -->
<!-- doctype declaration - lets browser know what document type to expect -->
<!DOCTYPE html>
<!-- html opening tag - all html code for the page needs to go inside these tags; the language has also been set to english -->
<html lang="en">
<!-- declare metadata -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easelly - Login</title>
</head>
<body>
    <!-- login page heading -->
    <h2>Login</h2>
    <!-- wrap input fields in a form element, and set the action to send the form to the /login endpoint using method POST -->
    <form action="/login" method="POST">
        <!-- username input field -->
        <label for="username">Username</label><br>
        <input type="text" name="username" id="username" size="20" required><br><br>

        <!-- password input field -->
        <label for="password">Password</label><br>
        <input type="password" name="password" id="password" size="30" required><br><br>

        <!-- submit action button -->
        <input type="submit" value="Login">
    </form>
    <br>
    <!-- link to registration page -->
    <p>Don't have an account? <a href="register.html">Register here</a></p>
</body>
</html>
